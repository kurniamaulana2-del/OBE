<!DOCTYPE html>
<html lang="id">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurikulum OBE (Outcome-Based Education)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS (XLSX) CDN untuk Ekspor & Impor Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- jsPDF and jsPDF-autotable for PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <!-- ChartJS for monitoring -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <link rel="stylesheet" href="assets/css/app.css">
</head>

<body class="bg-gray-100 font-sans text-gray-800 antialiased min-h-screen flex flex-col">

    <!-- Authentication Screen (prototype only; production authentication must be server-side) -->
    <div id="login-screen" class="hidden min-h-screen w-full bg-gradient-to-br from-blue-950 via-blue-900 to-slate-900 px-4 py-10">
        <div class="mx-auto flex min-h-[calc(100vh-5rem)] max-w-5xl items-center justify-center">
            <div class="grid w-full overflow-hidden rounded-2xl bg-white shadow-2xl lg:grid-cols-2">
                <section class="flex flex-col bg-blue-950 p-8 text-white sm:p-10">
                    <div class="mb-8 flex items-center gap-3">
                        <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-yellow-400 text-blue-950">
                            <i class="fa-solid fa-graduation-cap text-2xl"></i>
                        </div>
                        <div>
                            <h1 class="font-extrabold tracking-wide">KURIKULUM OBE</h1>
                            <p class="text-xs text-blue-200">Academic Assessment System</p>
                        </div>
                    </div>
                    <div class="mt-10 flex flex-1 items-center justify-center">
                        <img src="LogoUSG02.png" alt="Logo USG 02" class="w-full max-w-md object-contain">
                    </div>
                </section>
                <section class="p-8 sm:p-10">
                    <div class="mb-7">
                        <p class="text-xs font-bold uppercase tracking-widest text-blue-700">Selamat datang</p>
                        <h2 class="mt-1 text-2xl font-extrabold text-gray-900">Masuk ke sistem</h2>
                        <p class="mt-2 text-sm text-gray-500">Gunakan username dan kata sandi akun Anda.</p>
                    </div>
                    <form onsubmit="login(event)" class="space-y-5">
                        <div>
                            <label for="login-username" class="mb-1.5 block text-sm font-semibold text-gray-700">Username</label>
                            <input id="login-username" name="username" autocomplete="username" required class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100">
                        </div>
                        <div>
                            <label for="login-password" class="mb-1.5 block text-sm font-semibold text-gray-700">Kata Sandi</label>
                            <input id="login-password" name="password" type="password" autocomplete="current-password" required class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100">
                        </div>
                        <div id="login-error" class="hidden rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700" role="alert"></div>
                        <button type="submit" class="w-full rounded-lg bg-blue-700 px-4 py-2.5 text-sm font-bold text-white shadow hover:bg-blue-800">
                            <i class="fa-solid fa-right-to-bracket mr-2"></i>Masuk
                        </button>
                    </form>
                </section>
            </div>
        </div>
    </div>

    <!-- Unified Sidebar -->
    <aside id="app-sidebar" class="flex flex-col shadow-2xl" aria-label="Navigasi utama" style="display:none">
        <div class="h-24 px-5 flex items-center gap-3 bg-blue-950 border-b border-blue-800/80">
            <div class="w-10 h-10 rounded-xl bg-yellow-400 text-blue-950 flex items-center justify-center shrink-0">
                <i class="fa-solid fa-graduation-cap text-xl"></i>
            </div>
            <div class="sidebar-brand-copy overflow-hidden">
                <h1 class="text-sm font-extrabold tracking-wide leading-tight">KURIKULUM OBE</h1>
                <p class="text-[10px] text-blue-200 mt-1 leading-tight">Outcome-Based Education<br>Academic Assessment System</p>
            </div>
        </div>
        <nav id="sidebar-nav" class="flex-1 overflow-y-auto px-3 py-5 space-y-2"></nav>
        <div class="p-3 border-t border-blue-800">
            <button id="sidebar-collapse-button" onclick="toggleSidebar()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-blue-100 hover:bg-blue-800 transition" title="Ciutkan sidebar">
                <i id="sidebar-collapse-icon" class="fa-solid fa-angles-left w-5"></i>
                <span id="sidebar-collapse-label" class="text-sm font-medium">Ciutkan sidebar</span>
            </button>
        </div>
    </aside>
    <button id="mobile-overlay" onclick="closeMobileSidebar()" aria-label="Tutup sidebar" style="display:none"></button>

    <div id="app-shell" class="min-h-screen flex flex-col" style="display:none">
        <!-- Minimal Top Bar -->
        <header class="h-16 bg-white border-b border-gray-200 shadow-sm sticky top-0 z-20">
            <div class="h-full px-4 sm:px-6 flex justify-between items-center">
                <div class="flex items-center gap-3 min-w-0">
                    <button onclick="toggleSidebar()" class="w-10 h-10 rounded-lg text-gray-600 hover:text-blue-800 hover:bg-blue-50 transition" aria-label="Buka atau tutup sidebar">
                        <i class="fa-solid fa-bars text-lg"></i>
                    </button>
                    <div class="hidden sm:block">
                        <p class="text-xs text-gray-400">Workspace</p>
                        <p id="topbar-page-title" class="text-sm font-semibold text-gray-700">Kurikulum</p>
                    </div>
                </div>
                <div class="flex items-center gap-2 sm:gap-3">
                    <select id="admin-context-prodi" onchange="switchAdminProgramContext(this.value)" class="hidden max-w-64 rounded-lg border border-gray-200 bg-white px-2 py-1.5 text-xs font-semibold text-gray-700"></select>
                    <button class="relative w-10 h-10 rounded-full text-gray-500 hover:bg-gray-100 transition" aria-label="Notifikasi">
                        <i class="fa-regular fa-bell"></i>
                        <span class="absolute top-2 right-2.5 w-2 h-2 rounded-full bg-red-500 ring-2 ring-white"></span>
                    </button>
                    <div class="h-8 w-px bg-gray-200"></div>
                    <div class="flex items-center gap-2">
                        <div class="w-9 h-9 rounded-full bg-blue-100 text-blue-800 flex items-center justify-center">
                            <i class="fa-solid fa-user"></i>
                        </div>
                        <div class="hidden sm:block leading-tight">
                            <p id="topbar-user-name" class="text-sm font-semibold text-gray-700">-</p>
                            <p id="topbar-user-role" class="text-[11px] text-gray-400">-</p>
                        </div>
                        <button onclick="logout()" class="ml-1 h-9 rounded-lg px-2 text-gray-500 hover:bg-red-50 hover:text-red-700" title="Keluar" aria-label="Keluar">
                            <i class="fa-solid fa-right-from-bracket"></i>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Fluid Content Workspace -->
        <div class="w-full p-3 sm:p-6 flex-1">
            <main class="bg-gray p-4 sm:p-6 rounded-xl shadow-md min-h-[500px] w-full overflow-x-auto">
                <div id="content-area"></div>
            </main>
        </div>

        <footer class="bg-gray-800 text-gray-400 py-4 px-4 text-center text-xs mt-auto">
            &copy; Kurikulum OBE - Kurikulum Berbasis Capaian Pembelajaran - Universitas Sunan Gresik
        </footer>
    </div>

    <!-- Root Modal & Dynamic Input -->
    <div id="app-modal-root"></div>
    <img id="rps-pdf-default-logo" src="LogoUSG01.png" alt="" class="hidden" aria-hidden="true">
    <input type="file" id="student-import-input" accept=".xlsx,.xls,.csv" class="hidden" onchange="importStudentsFromExcel(event)">
    <input type="file" id="grade-import-input" accept=".xlsx,.xls,.csv" class="hidden" onchange="importGradesFromExcel(event)">

    <!-- JavaScript Application Modules -->
    <script src="assets/js/state.js"></script>
    <script src="assets/js/core.js"></script>
    <script src="assets/js/admin.js"></script>
    <script src="assets/js/curriculum.js"></script>
    <script src="assets/js/lectures.js"></script>
    <script src="assets/js/rps.js"></script>
    <script src="assets/js/class-management.js"></script>
    <script src="assets/js/course-matrix.js"></script>
    <script src="assets/js/assessment.js"></script>
    <script src="assets/js/attendance.js"></script>
    <script src="assets/js/monitoring.js"></script>
</body>
</html>
